<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <title>KIOSK Radio — Phonk DJ Mixes</title>
  <meta name="description" content="KIOSK Radio: phonk DJ mixes cut for our car and motorcycle films. Stream the mixes and download full-length versions.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf8">
  <script>/* Day/night before first paint: follows local time unless the visitor picked one */(function(){var p='auto';try{p=JSON.parse(localStorage.getItem('kiosk:theme'))||'auto'}catch(e){}var h=new Date().getHours();document.documentElement.setAttribute('data-theme',p==='auto'?(h>=6&&h<19?'light':'dark'):p)})();</script>
  <link rel="canonical" href="https://onlyatthekiosk.com/radio.html">
  <meta property="og:title" content="KIOSK Radio — Phonk DJ Mixes">
  <meta property="og:image" content="https://onlyatthekiosk.com/images/KiosKBoxLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="css/kiosk-glass.css" rel="stylesheet">
  <link href="images/favicon.jpg" rel="shortcut icon" type="image/x-icon">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MCKHRGGYRJ"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-MCKHRGGYRJ');</script>
</head>
<body class="k" data-page="radio">
  <a class="k-skip" href="#main">Skip to content</a>
  <main id="main">
    <header class="k-page-head">
      <div class="k-wrap">
        <p class="k-eyebrow"><span class="k-live" aria-hidden="true"></span><b>KIOSK Radio</b> · Phonk</p>
        <h1 class="k-display k-stagger k-mt-m">
          <span>Cowbells, 808s</span>
          <span>&amp; empty <em class="k-serif">highways.</em></span>
        </h1>
        <p class="k-lede k-mt-m">The phonk playlists behind the films, straight from our Spotify. Press play and it keeps going while you browse the site.</p>
      </div>
    </header>

    <section class="k-section" style="padding-top:0" aria-label="Now playing">
      <div class="k-wrap" data-mount="radio"></div>
    </section>

    <section class="k-section k-section--tight" aria-labelledby="tl-title">
      <div class="k-wrap">
        <div class="k-section-head">
          <div>
            <p class="k-eyebrow">Playlists</p>
            <h2 class="k-h2" id="tl-title">Every <em class="k-serif">playlist.</em></h2>
          </div>
        </div>
        <div class="k-stack" style="gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))" data-mount="tracklists"></div>
      </div>
    </section>
  </main>
  <script src="js/kiosk-content.js"></script>
  <script src="js/kiosk-mockups.js"></script>
  <script src="js/kiosk-glass.js"></script>
