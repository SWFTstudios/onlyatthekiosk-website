name: Cloudflare Preview

# Every PR gets a Workers Preview link: the PR code is uploaded as a
# non-production Worker version with preview alias "pr-<number>", and the
# URL is posted (and updated) as a PR comment:
#   https://pr-<number>-onlyatthekiosk-website.elombe.workers.dev
# Production (onlyatthekiosk.com) is never touched by this workflow.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  e246ec2918a6cd045fd4bfd00f024f0c
# Preview URLs are enabled on the Worker (previews_enabled); they share
# production bindings (D1, secrets), so treat previews as staging, not
# a sandbox: don't run destructive tests against accounts/orders there.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping preview upload."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run build:worker
          OUT=$(npx --yes wrangler@4 versions upload \
            --tag "pr-$PR" \
            --message "PR #$PR $SHA" \
            --preview-alias "pr-$PR" 2>&1)
          echo "$OUT"
          VERSION=$(echo "$OUT" | grep -oE 'Worker Version ID: [a-f0-9-]+' | awk '{print $NF}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=https://pr-$PR-onlyatthekiosk-website.elombe.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Comment preview link on the PR
        if: steps.upload.outputs.skipped != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          VERSION: ${{ steps.upload.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\n### Cloudflare Preview\n\n**Preview:** ${process.env.PREVIEW_URL}\n\nVersion \`${process.env.VERSION}\` · commit \`${process.env.SHA.slice(0, 7)}\`\n\nPages: [Radio](${process.env.PREVIEW_URL}/radio) · [KIOSK TV](${process.env.PREVIEW_URL}/tv.html) · [Home](${process.env.PREVIEW_URL}/)\n\n_This preview runs the PR code only; production (onlyatthekiosk.com) is unchanged. Preview shares production bindings (D1/secrets) — treat it as staging._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
